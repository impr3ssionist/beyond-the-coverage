name: Deploy to Production

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  security-scan:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    needs:
      - validate
      - security-scan
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://beyondthecoverage.com

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://beyondthecoverage.com

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  health-check:
    name: Health Check
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Verify production deployment
        run: |
          set -euo pipefail

          base_url="https://beyondthecoverage.com"

          check_status() {
            local label="$1"
            local path="$2"
            local expected="$3"
            local status

            status="$(curl --location --silent --output /dev/null --write-out "%{http_code}" "$base_url$path")"
            echo "$label returned HTTP $status"

            if [ "$status" != "$expected" ]; then
              echo "Expected $label to return HTTP $expected"
              return 1
            fi
          }

          for i in {1..5}; do
            if check_status "Home page" "/" "200" &&
               check_status "Admin login" "/admin/login" "200"; then
              contact_status="$(curl --location --silent --output /dev/null --write-out "%{http_code}" "$base_url/api/contact")"
              echo "Contact API returned HTTP $contact_status"

              if [ "$contact_status" != "404" ] && [ "$contact_status" != "000" ]; then
                echo "Production health checks passed"
                exit 0
              fi

              echo "Expected Contact API to exist"
            fi

            if [ "$i" = "5" ]; then
              echo "Production health checks failed"
              exit 1
            fi

            echo "Attempt $i/5 failed; retrying..."
            sleep 10
          done
