name: Deploy to Development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy-dev:
    name: Deploy to Development
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: development
      url: https://dev.beyondthecoverage.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@v4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod=false
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://dev.beyondthecoverage.com

      - name: Smoke test
        run: |
          set -euo pipefail

          base_url="https://dev.beyondthecoverage.com"

          curl --fail --silent --show-error "$base_url/" > /dev/null
          curl --fail --silent --show-error "$base_url/admin/login" > /dev/null

          contact_status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$base_url/api/contact")"
          if [ "$contact_status" = "404" ] || [ "$contact_status" = "000" ]; then
            echo "Expected /api/contact to exist, got HTTP $contact_status"
            exit 1
          fi

          echo "Development smoke tests passed"
