name: Deploy to Development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy-dev:
    name: Deploy to Development
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: development
      url: https://dev.beyondthecoverage.com

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_DEV }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.DEV_APP_URL }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test
        run: |
          set -euo pipefail

          base_url="${{ secrets.DEV_APP_URL }}"

          curl --fail --silent --show-error "$base_url/" > /dev/null
          curl --fail --silent --show-error "$base_url/admin/login" > /dev/null

          contact_status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$base_url/api/contact")"
          if [ "$contact_status" = "404" ] || [ "$contact_status" = "000" ]; then
            echo "Expected /api/contact to exist, got HTTP $contact_status"
            exit 1
          fi

          echo "Development smoke tests passed"
